[workspace]
members = ["crates/corpus", "crates/m0-experiment-2", "crates/mimus", "crates/mimus-core", "crates/mimus-quality-contract", "crates/scorecard"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/eeee0717/mimus"
rust-version = "1.88"

[workspace.dependencies]
mimus-core = { path = "crates/mimus-core" }
mimus-quality-contract = { path = "crates/mimus-quality-contract" }
clap = { version = "4", features = ["derive"] }
insta = "1"
image = { version = "0.25", default-features = false }
lopdf = { version = "0.44", default-features = false }
ort = "=2.0.0-rc.13"
pdfium-render = { version = "=0.9.1", default-features = false, features = ["pdfium_7763", "thread_safe"] }
quick-xml = "0.41"
rayon = "1"
redb = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
secrecy = "0.10"
sha2 = "0.10"
tempfile = "3"
subsetter = { version = "0.2.6", default-features = false }
thiserror = "2"
toml = "0.9"
