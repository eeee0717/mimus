[workspace]
members = ["common", "reference-runner", "candidate-runner", "orchestrator"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.77"
publish = false

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
experiment-4-common = { path = "common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
