name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  quality:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: rustup toolchain install stable --component rustfmt,clippy --profile minimal

      - uses: Swatinem/rust-cache@v2

      - name: Install PDF validation tools
        run: sudo apt-get update && sudo apt-get install --yes qpdf poppler-utils mupdf-tools

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets --all-features

      - name: Incremental writeback PoC
        run: cargo test --manifest-path experiments/m0-experiment-3-poc/Cargo.toml

      - name: Validate PoC with independent PDF tools
        run: |
          cargo run --manifest-path experiments/m0-experiment-3-poc/Cargo.toml
          python3 experiments/m0-experiment-3-poc/verify_outputs.py
