name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  quality:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: rustup toolchain install stable --component rustfmt,clippy --profile minimal

      - uses: Swatinem/rust-cache@v2

      - name: Install PDF validation tools
        run: sudo apt-get update && sudo apt-get install --yes qpdf poppler-utils mupdf-tools

      - name: Install pinned PDFium
        env:
          PDFIUM_ARCHIVE_SHA256: be513e8021a5bf8eb2116e00d78c3bacb82c5a02b3785156ae14fe5e33084385
        run: |
          curl --fail --location --output pdfium.tgz \
            https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/8009/pdfium-linux-x64.tgz
          echo "$PDFIUM_ARCHIVE_SHA256  pdfium.tgz" | sha256sum --check
          mkdir pdfium
          tar -xzf pdfium.tgz -C pdfium

      - name: Install pinned PP-DocLayoutV3
        env:
          LAYOUT_MODEL_COMMIT: 46bbdf188bb0a772c08aed74882ce7e51a8f1ea6
          LAYOUT_MODEL_SHA256: 45bf71750b00739a41fc209f132eb104a4d6b5bb29483c9078164d8b87cf28ba
        run: |
          curl --fail --location --retry 3 --output pp-doclayoutv3.onnx \
            "https://huggingface.co/PaddlePaddle/PP-DocLayoutV3_onnx/resolve/$LAYOUT_MODEL_COMMIT/inference.onnx"
          echo "$LAYOUT_MODEL_SHA256  pp-doclayoutv3.onnx" | sha256sum --check

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        env:
          MIMUS_PDFIUM_LIBRARY: ${{ github.workspace }}/pdfium/lib/libpdfium.so
          MIMUS_LAYOUT_MODEL: ${{ github.workspace }}/pp-doclayoutv3.onnx
        run: cargo test --workspace --all-targets --all-features

      - name: Audit committed Corpus v1 evidence
        run: cargo run --locked --offline -p corpus -- audit

      - name: Validate pinned Corpus CI manifest
        run: python3 scripts/ci/install_corpus_toolchain.py --manifest corpus/ci-toolchain.toml --check

      - name: Incremental writeback PoC
        run: cargo test --manifest-path experiments/m0-experiment-3-poc/Cargo.toml

      - name: Validate PoC with independent PDF tools
        run: |
          cargo run --manifest-path experiments/m0-experiment-3-poc/Cargo.toml
          python3 experiments/m0-experiment-3-poc/verify_outputs.py

  corpus:
    name: pinned corpus doctor · determinism · verify
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Isolate the runner Homebrew prefix
        run: |
          if [[ -e /home/linuxbrew/.linuxbrew ]]; then
            sudo mv /home/linuxbrew/.linuxbrew "$RUNNER_TEMP/homebrew-runner"
          fi
          sudo mkdir -p /home/linuxbrew
          sudo chown "$USER:$(id -gn)" /home/linuxbrew

      - name: Restore pinned Corpus toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            /home/linuxbrew/.linuxbrew
            ${{ runner.tool_cache }}/mimus-corpus-toolchain
          key: corpus-toolchain-linux-x64-${{ hashFiles('corpus/ci-toolchain.toml') }}

      - name: Install pinned Corpus toolchain
        run: |
          python3 scripts/ci/install_corpus_toolchain.py \
            --manifest corpus/ci-toolchain.toml \
            --tool-root "$RUNNER_TOOL_CACHE/mimus-corpus-toolchain" \
            > "$RUNNER_TEMP/corpus-toolchain-paths"
          while IFS= read -r directory; do
            echo "$directory" >> "$GITHUB_PATH"
          done < "$RUNNER_TEMP/corpus-toolchain-paths"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Corpus doctor
        run: cargo run --locked --offline -q -p corpus -- doctor

      - name: Corpus determinism
        run: cargo run --locked --offline -q -p corpus -- determinism

      - name: Independent Corpus verification
        run: cargo run --locked --offline -q -p corpus -- verify
