name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  quality:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: rustup toolchain install stable --component rustfmt,clippy --profile minimal

      - uses: Swatinem/rust-cache@v2

      - name: Install PDF validation tools
        run: sudo apt-get update && sudo apt-get install --yes qpdf poppler-utils mupdf-tools

      - name: Install pinned PDFium
        env:
          PDFIUM_ARCHIVE_SHA256: be513e8021a5bf8eb2116e00d78c3bacb82c5a02b3785156ae14fe5e33084385
        run: |
          curl --fail --location --output pdfium.tgz \
            https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/8009/pdfium-linux-x64.tgz
          echo "$PDFIUM_ARCHIVE_SHA256  pdfium.tgz" | sha256sum --check
          mkdir pdfium
          tar -xzf pdfium.tgz -C pdfium

      - name: Install pinned PP-DocLayoutV3
        env:
          LAYOUT_MODEL_COMMIT: 46bbdf188bb0a772c08aed74882ce7e51a8f1ea6
          LAYOUT_MODEL_SHA256: 45bf71750b00739a41fc209f132eb104a4d6b5bb29483c9078164d8b87cf28ba
        run: |
          curl --fail --location --retry 3 --output pp-doclayoutv3.onnx \
            "https://huggingface.co/PaddlePaddle/PP-DocLayoutV3_onnx/resolve/$LAYOUT_MODEL_COMMIT/inference.onnx"
          echo "$LAYOUT_MODEL_SHA256  pp-doclayoutv3.onnx" | sha256sum --check

      - name: Install pinned production output fonts
        env:
          NOTO_COMMIT: 523d033d6cb47f4a80c58a35753646f5c3608a78
          NOTO_SERIF_SC_VF_SHA256: 69467baf421bdbb32b292d6c092ed033ca32e5f7a0d06194e69901287b50b2f3
          STIX_FONTS_COMMIT: 744a22a4dd626cd14d75728aef34fc8ad7c85db0
          GOOGLE_FONTS_COMMIT: 9017368e541f77a66e2302f474d2142d1bb77f5c
          STIX_TWO_TEXT_VF_SHA256: 7962b8b7811e6a896c9a91a0bccbb5241047770eb24d4997c5cb5fe21d5c0df2
          STIX_TWO_MATH_SHA256: 562551b15b836e6e01d1b7350909baf3c8c8d83260c1190fbf4544333e6936de
        run: |
          curl --fail --location --retry 3 --output NotoSerifSC-VF.ttf \
            "https://raw.githubusercontent.com/notofonts/noto-cjk/$NOTO_COMMIT/Serif/Variable/TTF/Subset/NotoSerifSC-VF.ttf"
          echo "$NOTO_SERIF_SC_VF_SHA256  NotoSerifSC-VF.ttf" | sha256sum --check
          curl --fail --location --retry 3 --output 'STIXTwoText[wght].ttf' \
            "https://raw.githubusercontent.com/stipub/stixfonts/$STIX_FONTS_COMMIT/fonts/variable_ttf/STIXTwoText%5Bwght%5D.ttf"
          echo "$STIX_TWO_TEXT_VF_SHA256  STIXTwoText[wght].ttf" | sha256sum --check
          curl --fail --location --retry 3 --output STIXTwoMath-Regular.ttf \
            "https://raw.githubusercontent.com/google/fonts/$GOOGLE_FONTS_COMMIT/ofl/stixtwomath/STIXTwoMath-Regular.ttf"
          echo "$STIX_TWO_MATH_SHA256  STIXTwoMath-Regular.ttf" | sha256sum --check

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        env:
          MIMUS_PDFIUM_LIBRARY: ${{ github.workspace }}/pdfium/lib/libpdfium.so
          MIMUS_LAYOUT_MODEL: ${{ github.workspace }}/pp-doclayoutv3.onnx
        run: cargo test --workspace --all-targets --all-features

      - name: Verify production font instance outline
        env:
          MIMUS_PINNED_OUTPUT_FONT: ${{ github.workspace }}/NotoSerifSC-VF.ttf
        run: >-
          cargo test --locked --offline -p mimus-core
          pass::tests::pinned_full_variable_font_regular_subset_matches_wght_400_outline
          -- --ignored --exact

      - name: Verify production STIX instances and symbol fallback
        env:
          MIMUS_PINNED_LATIN_FONT: ${{ github.workspace }}/STIXTwoText[wght].ttf
          MIMUS_PINNED_SYMBOL_FONT: ${{ github.workspace }}/STIXTwoMath-Regular.ttf
        run: >-
          cargo test --locked --offline -p mimus-core
          pass::tests::pinned_stix_text_instances_and_math_fallback_match_the_manifest
          -- --ignored --exact

      - name: Audit committed Corpus v1 evidence
        run: cargo run --locked --offline -p corpus -- audit

      - name: Validate pinned Corpus CI manifest
        run: python3 scripts/ci/install_corpus_toolchain.py --manifest corpus/ci-toolchain.toml --check

      - name: Build isolated Corpus gate executable
        run: |
          cargo build --locked --offline -p corpus --bin corpus
          sha256sum target/debug/corpus | cut -d' ' -f1 > target/debug/corpus.sha256

      - name: Upload isolated Corpus gate executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: corpus-gate-${{ github.sha }}
          path: |
            target/debug/corpus
            target/debug/corpus.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Incremental writeback PoC
        run: cargo test --manifest-path experiments/m0-experiment-3-poc/Cargo.toml

      - name: Validate PoC with independent PDF tools
        run: |
          cargo run --manifest-path experiments/m0-experiment-3-poc/Cargo.toml
          python3 experiments/m0-experiment-3-poc/verify_outputs.py

  corpus:
    name: pinned corpus doctor · determinism · verify
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download isolated Corpus gate executable
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: corpus-gate-${{ github.sha }}
          path: ${{ runner.temp }}/corpus-gate

      - name: Verify isolated Corpus gate executable
        run: |
          echo "$(cat "$RUNNER_TEMP/corpus-gate/corpus.sha256")  $RUNNER_TEMP/corpus-gate/corpus" \
            | sha256sum --check
          chmod +x "$RUNNER_TEMP/corpus-gate/corpus"

      - name: Isolate the runner Homebrew prefix
        run: |
          if [[ -e /home/linuxbrew/.linuxbrew ]]; then
            sudo mv /home/linuxbrew/.linuxbrew "$RUNNER_TEMP/homebrew-runner"
          fi
          sudo mkdir -p /home/linuxbrew
          sudo chown "$USER:$(id -gn)" /home/linuxbrew

      - name: Restore pinned Corpus toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            /home/linuxbrew/.linuxbrew
            ${{ runner.tool_cache }}/mimus-corpus-toolchain
          key: corpus-toolchain-linux-x64-${{ hashFiles('corpus/ci-toolchain.toml') }}

      - name: Install pinned Corpus toolchain
        run: |
          python3 scripts/ci/install_corpus_toolchain.py \
            --manifest corpus/ci-toolchain.toml \
            --tool-root "$RUNNER_TOOL_CACHE/mimus-corpus-toolchain" \
            > "$RUNNER_TEMP/corpus-toolchain-paths"
          while IFS= read -r directory; do
            echo "$directory" >> "$GITHUB_PATH"
          done < "$RUNNER_TEMP/corpus-toolchain-paths"

      - name: Corpus doctor
        run: '"$RUNNER_TEMP/corpus-gate/corpus" doctor'

      - name: Corpus determinism
        run: '"$RUNNER_TEMP/corpus-gate/corpus" determinism'

      - name: Independent Corpus verification
        run: '"$RUNNER_TEMP/corpus-gate/corpus" verify'
