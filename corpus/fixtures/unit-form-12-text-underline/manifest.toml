    "hand-written-geometry",
    "pdf-bytes",
    "pdf-structure",
    "render",
]

[[adjudication]]
date = "2026-09-01"
issue = "Deleting or retaining a moved owner's underline would lose content or leave orphan source-slot ink"
resolution = "Only a uniquely owned, safe, complete horizontal stroke follows one determinate single-line owner delta; every ambiguous case is typed source preservation"
