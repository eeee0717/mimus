[[expected.behaviour]]
id = "FORM-12-unique-owner-translation"
assertion = "The underline is replayed inside a -18pt x translation with the first replacement span, and no stroke remains at the source x=90 slot"
observable_via = "walker ownership, decoded output stream, MuPDF stroke geometry, and final rendered output"

[[expected.behaviour]]
id = "FORM-12-ambiguous-owner-terminal"
assertion = "A nearby underline without one safe complete text-show owner preserves the whole paragraph as typeset_protocol instead of deleting or abandoning ink"
observable_via = "production ownership unit test and write-stage typed paragraph state"

[oracle]
