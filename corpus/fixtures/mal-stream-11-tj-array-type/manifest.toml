[[adjudication]]
date = "2026-08-24"
issue = "STREAM-11 allows skipping the bad element or discarding the whole TJ"
resolution = "Skip the element with zero adjustment: zero is the only adjustment the spec lets us infer, and skipping keeps the run intact"
[[adjudication]]
date = "2026-08-24"
issue = "MuPDF turned out to reject the page outright, so it cannot serve as a raster reference and it contradicts the recovery chosen above"
resolution = "Keep the recovery and record the divergence as an asserted behaviour: MuPDF's refusal is evidence the stream is genuinely malformed, not evidence that dropping the text is correct"
