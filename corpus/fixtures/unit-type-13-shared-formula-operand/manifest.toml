[[expected.behaviour]]
id = "TYPE-13-shared-flow-geometry"
assertion = "Translated text and split formula glyphs wrap together without changing the original show advance or intersecting retained ink"
observable_via = "typeset-stage geometry, degradation_summary, rendered output, and dual-extractor text"

