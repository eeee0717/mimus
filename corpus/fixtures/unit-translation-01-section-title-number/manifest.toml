[[expected.behaviour]]
id = "TRANS-01-title-policy"
assertion = "A model paragraph_title remains translatable even when its region is in the top twelve percent of the page"
observable_via = "recorded layout, translation request, and paragraph-find IL"

[[expected.behaviour]]
id = "TRANS-01-section-number"
assertion = "The geometrically leading section number is reclassified as number passthrough, omitted from the translation request, and retained at its original position"
observable_via = "paragraph-find IL, captured translation request, final content spans, and dual-extractor output"

[[expected.behaviour]]
id = "TRANS-01-source-title-origin"
assertion = "Typeset keeps the output section prefix at x=108pt and restores the translated title's first-glyph origin to the source title origin x=125pt without inserting a whitespace scalar"
observable_via = "ParagraphFind Number/passthrough labels, Write-IL section_number_gap evidence and publication glyph origins"

[oracle]
checks = [
    "determinism",
    "legality",
    "page-geometry",
    "glyphs",
    "transformed-text-geometry",
    "pdf-bytes",
    "pdf-structure",
    "render",
]

[[adjudication]]
date = "2026-08-27"
issue = "The same-baseline title and geometrically leading section marker are one text block (MIMUSI) in MuPDF and two blocks in Poppler, so parser block structure cannot represent the section-ownership boundary consistently."
resolution = "Keep the exact geometry because the same-line left marker is the production shape under test. Do not claim parser-agreed structure or block geometry; assert all six glyphs independently with MuPDF trace origins, qpdf font metrics, and SVG outlines, plus the page glyph multiset. The recorded layout and M2 production-path test own the title/number policy assertion."
