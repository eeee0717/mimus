schema_version = 1

[identity]
id = "unit-order-04-model-cross-column"
name = "One model Abstract region crosses columns"
class = "unit"
legality = "legal"
cases = ["ORDER-04"]
priority = "M3"
variable = "One recorded Abstract region owns a left-column tail and right-column head"

[source]
method = "realistic-typesetting"
engine = "typst"
source_file = "unit-order-04-model-cross-column.typ"
pdf = "unit-order-04-model-cross-column.pdf"
pdf_sha256 = "cae117511ffc2740efedc2d2f12d90ee7e12499857fdfa62c91ed41b13fc7c30"
font_provenance = "typst-embedded"

[[page]]
index = 0
media_box = [0.0, 0.0, 420.0, 220.0]
rotate = 0

[expected]
geometry_source = "dual-parser-adjudicated"
tolerance_pt = 0.05

[expected.structure]
pages = 1
blocks = 6
columns = 2

[[expected.block]]
key = "L1"
page = 0
column = "left"
draw_order = 1
reading_order = 1
text = "The abstract opens with enough text to establish the left column as a continuous reading region before the boundary case appears."

[[expected.block]]
key = "L2"
page = 0
column = "left"
draw_order = 2
reading_order = 2
text = "A second left-column block keeps the staggered geometry distinct from a table or a row-aligned grid."

[[expected.block]]
key = "LEFT"
page = 0
column = "left"
draw_order = 3
reading_order = 3
text = "Its final left-column sentence reaches the foot of the column and"

[[expected.block]]
key = "RIGHT"
page = 0
column = "right"
draw_order = 4
reading_order = 4
text = "continues at the head of the right column without a semantic break."

[[expected.block]]
key = "R2"
page = 0
column = "right"
draw_order = 5
reading_order = 5
text = "The right column then resumes ordinary abstract prose after the continuation has completed."

[[expected.block]]
key = "R3"
page = 0
column = "right"
draw_order = 6
reading_order = 6
text = "A final block closes the abstract and remains inside the same model-owned region."

[[expected.behaviour]]
id = "ORDER-04-model-evidence"
assertion = "The six lines form one column-ordered request with LEFT immediately before RIGHT only because one model Abstract region owns both columns"
observable_via = "recorded model region, ParagraphFind IL, and captured translation request"

[oracle]
checks = ["determinism", "legality", "page-geometry", "structure", "reading-order", "dual-parser-geometry", "render"]

[[adjudication]]
date = "2026-09-01"
issue = "Cross-column merging without model evidence can join unrelated prose"
resolution = "Permit the merge only when one model region covers both fragments and retain the source reading order"
