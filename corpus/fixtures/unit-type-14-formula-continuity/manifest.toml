name = "Shared inline-formula reading continuity"
class = "unit"
legality = "legal"
cases = ["TYPE-14"]
priority = "M3"
variable = "A shorter translation leaves an otherwise collision-free fixed formula slot beyond the source-derived reading-continuity bound"

