# unit-geom-01-rotate-neg90 —— expected manifest
#
# 本文件先于 unit-geom-01-rotate-neg90.tex 手写。五份 .tex 只差 \\pdftrailerid 与 /Rotate 的取值，正文与页面尺寸完全一致。

schema_version = 1

[identity]
id = "unit-geom-01-rotate-neg90"
name = "页面旋转 /Rotate -90"
class = "unit"
legality = "legal"
cases = ["GEOM-04"]
priority = "M0"
variable = "页面字典的 /Rotate 取 -90，内容与其余四份完全相同"

[source]
method = "realistic-typesetting"
engine = "pdftex"
source_file = "unit-geom-01-rotate-neg90.tex"
pdf = "unit-geom-01-rotate-neg90.pdf"
pdf_sha256 = "3e8a48916f8da805fe1db53b57ff693816f82699ea85d75e333ac4b160ec9ac4"
font_provenance = "texlive-bundled"

# MediaBox 来自 \\pdfpagewidth=300bp / \\pdfpageheight=200bp，/Rotate 来自 \\pdfpageattr{/Rotate -90}。
[[page]]
index = 0
media_box = [0.0, 0.0, 300.0, 200.0]
rotate = -90

[expected]
geometry_source = "dual-parser-adjudicated"
tolerance_pt = 0.05
# Computer Modern Type1 下 mutool 的字形 quad 比 poppler 的词盒高出约 0.22pt；
# 这是字体度量的差，不是解析器分歧，因此与 tolerance_pt 分开声明。
ink_margin_pt = 0.3

[expected.structure]
pages = 1
blocks = 2
columns = 1

[[expected.block]]
key = "T1"
page = 0
column = "full"
draw_order = 1
reading_order = 1
text = "Rotation must not move the text in page space."

[[expected.block]]
key = "T2"
page = 0
column = "full"
draw_order = 2
reading_order = 2
text = "Second block, second font weight, well below the first."

[[expected.behaviour]]
id = "GEOM-04-invariance"
assertion = "换算回页面空间后，两个块的三个盒子与其余四个 /Rotate 取值逐块相同"
observable_via = "corpus verify 的 group/geom-equal 跨 fixture 断言"

[[expected.behaviour]]
id = "GEOM-04-raster"
assertion = "/Rotate -90 下 150 dpi 出图为 417×625 像素"
observable_via = "pdftoppm -r 150 出的 PNG 的 IHDR 宽高"

[[expected.behaviour]]
id = "GEOM-04-poppler-order"
assertion = "poppler 在本 /Rotate 取值下把两个块的顺序报反了；mutool 的绘制次序不受影响，两者的坐标一致"
observable_via = "pdftotext -bbox-layout 与 mutool draw -F stext 的 <block> 顺序对照"

[oracle]
# 刻意不含 reading-order，理由见文末 [[adjudication]]。
checks = ["determinism", "legality", "page-geometry", "structure", "dual-parser-geometry", "render"]

[group]
name = "rotate-invariance"
page_geometry_identical_with = ["unit-geom-01-rotate-0", "unit-geom-01-rotate-90", "unit-geom-01-rotate-180", "unit-geom-01-rotate-270"]

[[adjudication]]
date = "2026-08-21"
issue = "poppler pdftotext -bbox-layout 在 /Rotate 270 与 -90 下把两个块的顺序倒过来报（先 T2 后 T1）。同样的内容在 /Rotate 0、90、180 下顺序正确；mutool 在全部五个取值下都按 content stream 次序报出；两个解析器的坐标在五个取值下换算回页面空间后逐块相同。"
resolution = "不改手写的 reading_order，也不为迁就 poppler 调整 fixture：这份 fixture 只是不声明 reading-order 这项检查，并把该观测记在这里与 GEOM-04-poppler-order 一条期望行为里。阅读顺序在 M0 由模型给出，poppler 只是旁证；旁证在某个 /Rotate 取值下失效是关于 poppler 的事实，不是关于这份 PDF 的。"
