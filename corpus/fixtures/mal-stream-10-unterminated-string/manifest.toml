[[adjudication]]
date = "2026-08-24"
issue = "A truncated stream could be salvaged up to the last complete operator instead of degrading the page"
resolution = "Degrade the page: ADR-0013 §3 keeps truncation a page-level failure so writeback never has to reason about a half-parsed tail"
[[adjudication]]
date = "2026-08-24"
issue = "The render check could not be used: mutool draw exits non-zero on this page, so there is no reference raster to compare"
resolution = "Take mutool's own diagnostic as the independent evidence instead—an independent renderer refusing the stream is exactly the observation this fixture needs"
