[[expected.behaviour]]
id = "STREAM-08-page-degrades"
assertion = "The tokenizer reaches end of stream inside a literal string, so the page degrades and its content stream is written back byte for byte"
observable_via = "output page content stream equals input, exit code 0, and one page-degraded diagnostic"
[[expected.behaviour]]
id = "STREAM-08-no-partial-il"
assertion = "No characters from the truncated stream reach the IL, because a partially tokenized page cannot be spliced safely"
