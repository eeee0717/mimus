[[expected.behaviour]]
id = "TYPE-01-tight-height"
assertion = "The title layout bounds equal the Latin outline ink height while leaving enough horizontal room for the deterministic short CJK translation"
observable_via = "hand-written visual bbox, layout recording, translation-stage IL, and typeset-stage geometry"

[[expected.behaviour]]
id = "TYPE-01-bounded-single-line"
assertion = "A one-line CJK title remains anchored to the source baseline and may exceed the tight Latin ink box only by the bounded output-glyph ink difference"
observable_via = "output character baselines and glyph ink boxes; page and non-owner layout regions remain disjoint"

[[expected.behaviour]]
id = "TYPE-01-bold-title"
assertion = "The doc_title recording selects the bold output font without changing the bounded fit contract"
observable_via = "layout recording label and embedded MimusB font resource"

[oracle]
checks = [
    "determinism",
    "legality",
    "page-geometry",
    "structure",
    "hand-written-geometry",
    "pdf-bytes",
    "pdf-structure",
    "render",
]

[[adjudication]]
date = "2026-08-26"
issue = "MuPDF stext character quads use horizontal advance bounds, not outline ink bounds"
resolution = "Keep the hand-derived visual bbox and validate it from MuPDF SVG glyph paths with exact Bezier extrema"
