# unit-type-01-single-line-tight -- expected manifest
#
# This specification predates the exact writer recipe. Geometry is derived
# from the pinned font's TrueType tables (2048 units/em) and PDF text-state
# arithmetic: baseline (72, 120), 12 pt, widths in PDF 1000-unit text space.

schema_version = 1

[identity]
id = "unit-type-01-single-line-tight"
name = "Tight single-line title container"
class = "unit"
legality = "legal"
cases = ["TYPE-01"]
priority = "M3"
variable = "A single Latin title whose layout container is exactly its one-line ink bounds"

[source]
method = "exact-writer"
generator = "corpus-exact-writer-v1"
pdf = "unit-type-01-single-line-tight.pdf"
pdf_sha256 = "aba85a2e5594376dab30cc94cfae3df64acc525f4d12d52cc61f6cb805ae7c3d"
