# unit-form-09-formula-boundary -- expected manifest
#
# This manifest is written before compiling the hand-authored Typst source.

schema_version = 1

[identity]
id = "unit-form-09-formula-boundary"
name = "Partially labelled inline formula boundaries"
class = "unit"
legality = "legal"
cases = ["FORM-09"]
priority = "M3"
variable = "A model formula region omits an attached script, closing delimiter, or the tail of one contiguous digit run"

[source]
method = "realistic-typesetting"
engine = "typst"
source_file = "unit-form-09-formula-boundary.typ"
pdf = "unit-form-09-formula-boundary.pdf"
pdf_sha256 = "1f937710983eeac11e91f9bfaf5d75114fff5a0499b7b05ca70e425824c3099c"
font_provenance = "typst-embedded"

[[page]]
index = 0
media_box = [0.0, 0.0, 420.0, 220.0]
rotate = 0

[expected]
geometry_source = "dual-parser-adjudicated"
tolerance_pt = 0.05

[expected.structure]
pages = 1
blocks = 5
columns = 1

[[expected.block]]
key = "F1"
page = 0
column = "full"
draw_order = 1
reading_order = 1
text = "Width is 𝑑model = 512, then continue."

[[expected.block]]
key = "F2"
page = 0
column = "full"
draw_order = 2
reading_order = 2
text = "We use 𝜀ls = 0.1[36] during training."

[[expected.block]]
key = "F3"
page = 0
column = "full"
draw_order = 3
reading_order = 3
text = "Sequence (𝑥1, …, 𝑥𝑛) is preserved."

[[expected.block]]
key = "F4"
page = 0
column = "full"
draw_order = 4
reading_order = 4
text = "Heads use ℎ = 64, then continue."

[[expected.block]]
key = "F5"
page = 0
column = "full"
draw_order = 5
reading_order = 5
text = "Scale by √𝑑model, then continue."

[[expected.behaviour]]
id = "FORM-09-model-authority"
assertion = "Boundary completion only expands an existing model inline_formula region and never creates one from ordinary prose"
observable_via = "recorded layout, StylesAndFormulas IL, and captured translation requests"

[[expected.behaviour]]
id = "FORM-09-complete-units"
assertion = "model, ls, script digits and closing delimiters remain source formula operands and never enter a translation request"
observable_via = "captured translation requests, typed diagnostics, and source/write operand identity"

[[expected.behaviour]]
id = "FORM-09-prose-guard"
assertion = "Prose immediately following each formula remains eligible for translation"
observable_via = "captured translation requests and Translate IL"

[[expected.behaviour]]
id = "FORM-09-contiguous-digit-run"
assertion = "When an existing model formula region ends at the first digit of a contiguous digit run, boundary completion expands through the remaining digits only"
observable_via = "captured translation requests, typed contiguous_digit_run evidence, and StylesAndFormulas IL"

[[expected.behaviour]]
id = "FORM-09-radical-operand-atomicity"
assertion = "A source radical geometrically attached to a model formula operand remains adjacent and ordered after typeset flow without changing the translation request"
observable_via = "captured translation request, Typeset IL, decoded incremental content, and dual-extractor text"

[oracle]
checks = ["determinism", "legality", "page-geometry", "glyphs", "render"]
