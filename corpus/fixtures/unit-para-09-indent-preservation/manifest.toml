[[expected.behaviour]]
id = "PARA-09-baseline-origin"
assertion = "ParagraphFind infers no indent, 12pt, and 36pt from first and median continuation baseline origins; glyph side bearings and tight ink do not enter the calculation"
observable_via = "recorded model regions and production paragraph IL"

[[expected.behaviour]]
id = "TYPE-12-absolute-copy"
assertion = "Typeset starts translated first lines exactly 0pt, 12pt, and 36pt to the right of their continuation lines at every wrapping candidate, without normalizing to CJK character widths"
observable_via = "captured translations and final-PDF output-font glyph origins"

[oracle]
checks = ["determinism", "legality", "page-geometry", "glyphs", "transformed-text-geometry", "pdf-bytes", "pdf-structure", "render"]

[[adjudication]]
date = "2026-09-01"
issue = "The original TYPE-12 expectation normalized every indent to two target-language characters"
resolution = "V1 copies the source indent as an absolute page-space point distance and does not classify quote paragraphs"
