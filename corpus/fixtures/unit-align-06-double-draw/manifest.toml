[[adjudication]]
date = "2026-08-25"
issue = "Two identical shows in one text object are coalesced by PDFium and do not model separate pseudo-bold painting events"
resolution = "Keep the exact same baseline and glyph but place each draw in its own BT/ET text object, matching the real double-draw mechanism"
[[adjudication]]
date = "2026-08-25"
issue = "PDFium coalesces byte-identical same-origin text objects even when their rendering modes differ"
resolution = "Keep the exact same baseline and M outline while encode the second draw through an alias code that maps to the same glyph and Unicode, preventing text-page coalescing from erasing multiplicity"
[[adjudication]]
date = "2026-08-25"
issue = "MuPDF and Poppler correctly expose one semantic M for the overprinted outline while the production text page retains both encoded paint events"
resolution = "Keep independent block.text as one visible M and assert the two walk/engine occurrences separately through expected.alignment"
