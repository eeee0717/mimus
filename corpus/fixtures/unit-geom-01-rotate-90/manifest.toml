# unit-geom-01-rotate-90 —— expected manifest
#
# 本文件先于 unit-geom-01-rotate-90.tex 手写。五份 .tex 只差 \\pdftrailerid 与 /Rotate 的取值，正文与页面尺寸完全一致。

schema_version = 1

[identity]
id = "unit-geom-01-rotate-90"
name = "页面旋转 /Rotate 90"
class = "unit"
legality = "legal"
cases = ["GEOM-04"]
priority = "M0"
variable = "页面字典的 /Rotate 取 90，内容与其余四份完全相同"

[source]
method = "realistic-typesetting"
engine = "pdftex"
source_file = "unit-geom-01-rotate-90.tex"
pdf = "unit-geom-01-rotate-90.pdf"
pdf_sha256 = "1510bd884a431cfa94adfb08f2c661951fdc08386dd6dd8e73e2cdb70ac49cf2"
font_provenance = "texlive-bundled"

# MediaBox 来自 \\pdfpagewidth=300bp / \\pdfpageheight=200bp，/Rotate 来自 \\pdfpageattr{/Rotate 90}。
[[page]]
index = 0
media_box = [0.0, 0.0, 300.0, 200.0]
rotate = 90

[expected]
geometry_source = "dual-parser-adjudicated"
tolerance_pt = 0.05
# Computer Modern Type1 下 mutool 的字形 quad 比 poppler 的词盒高出约 0.22pt；
# 这是字体度量的差，不是解析器分歧，因此与 tolerance_pt 分开声明。
ink_margin_pt = 0.3

[expected.structure]
pages = 1
blocks = 2
columns = 1

[[expected.block]]
key = "T1"
page = 0
column = "full"
draw_order = 1
reading_order = 1
text = "Rotation must not move the text in page space."

[[expected.block]]
key = "T2"
page = 0
column = "full"
draw_order = 2
reading_order = 2
text = "Second block, second font weight, well below the first."

[[expected.behaviour]]
id = "GEOM-04-invariance"
assertion = "换算回页面空间后，两个块的三个盒子与其余四个 /Rotate 取值逐块相同"
observable_via = "corpus verify 的 group/geom-equal 跨 fixture 断言"

[[expected.behaviour]]
id = "GEOM-04-raster"
assertion = "/Rotate 90 下 150 dpi 出图为 417×625 像素"
observable_via = "pdftoppm -r 150 出的 PNG 的 IHDR 宽高"

[oracle]
checks = ["determinism", "legality", "page-geometry", "structure", "reading-order", "dual-parser-geometry", "render"]

[group]
name = "rotate-invariance"
page_geometry_identical_with = ["unit-geom-01-rotate-0", "unit-geom-01-rotate-180", "unit-geom-01-rotate-270", "unit-geom-01-rotate-neg90"]
