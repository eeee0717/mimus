# unit-layout-02-table-only —— expected manifest
#
# 本文件先于 unit-layout-02-table-only.typ 手写。三个块按行划分：两个解析器都把同一行的三个单元格并成一行文本。

schema_version = 1

[identity]
id = "unit-layout-02-table-only"
name = "整页只有一个 3×3 有线表格"
class = "unit"
legality = "legal"
cases = ["LAYOUT-02", "TABLE-01"]
priority = "M0"
variable = "页面上除表格外没有任何正文"

[source]
method = "realistic-typesetting"
engine = "typst"
source_file = "unit-layout-02-table-only.typ"
pdf = "unit-layout-02-table-only.pdf"
pdf_sha256 = "fc4cafda597db96b6a3640e3823e9a0758899dc29a935e3d47b124781bd03f19"
font_provenance = "typst-embedded"

[[page]]
index = 0
media_box = [0.0, 0.0, 340.0, 160.0]
rotate = 0

[expected]
geometry_source = "dual-parser-adjudicated"
tolerance_pt = 0.05

[expected.structure]
pages = 1
blocks = 9
columns = 1

[[expected.block]]
key = "C11"
page = 0
column = "full"
draw_order = 1
reading_order = 1
text = "Run"

[[expected.block]]
