[[expected.behaviour]]
id = "LAYOUT-02-no-requests"
assertion = "表格内文字不得进入任何翻译请求；本页的请求列表应为空"
observable_via = "实验 1 中模型给整页的类别标签：应为 table 而非正文类"

[[expected.behaviour]]
id = "D4-no-fallback"
assertion = "若模型能框出整张表，就不需要 BabelDOC 的 9 个魔数兜底聚类（红利清单 D4）"
observable_via = "实验 1 中模型是否漏检本页的表格"

[[expected.behaviour]]
id = "D9-cell-granularity"
assertion = "单元格粒度是否可得，决定二级表格检测模型是否要抄回（红利清单 D9）"
observable_via = "实验 1 中模型是否给出 table_cell 类的框"

[oracle]
# 块级次序与几何不可裁定，理由见文末 [[adjudication]]。
checks = ["determinism", "legality", "page-geometry", "glyphs", "render"]

[[adjudication]]
date = "2026-08-21"
issue = "首版 manifest 按「行」写了 3 个块。实测两个解析器的分块粒度不同：mutool draw -F stext 给出 3 个行块，poppler pdftotext -bbox-layout 给出 9 个单元格块。两者不可能同时成立。"
resolution = "manifest 改写成 9 个单元格块——那是表格的事实结构，不迁就任何一方；同时不声明 structure / reading-order / dual-parser-geometry，改用 glyphs 断言字符多重集。粒度分歧本身记在这里，它正是 D9（单元格粒度是否可得）要在实验 1 里回答的问题。"
