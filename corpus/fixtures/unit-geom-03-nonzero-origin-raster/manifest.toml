# unit-geom-03-nonzero-origin-raster —— expected manifest
#
# 本文件先于 unit-geom-03-nonzero-origin-raster.tex 手写。原点偏移由 \\pdfpageattr 直接写死，与内容无关。

schema_version = 1

[identity]
id = "unit-geom-03-nonzero-origin-raster"
name = "MediaBox 原点非零且无 CropBox"
class = "unit"
legality = "legal"
cases = ["GEOM-05"]
priority = "M0"
variable = "MediaBox 原点从 (0,0) 移到 (10,10)，content stream 坐标不变"

[source]
method = "realistic-typesetting"
engine = "pdftex"
source_file = "unit-geom-03-nonzero-origin-raster.tex"
pdf = "unit-geom-03-nonzero-origin-raster.pdf"
pdf_sha256 = "9c691eb7a0776a515396bda5d79179092a0aff98ec1485eeb5ec84b511c86011"
font_provenance = "texlive-bundled"

# MediaBox 来自 \\pdfpageattr{/MediaBox [10 10 310 210]}，覆盖 \\pdfpagewidth/\\pdfpageheight 写出的默认框。
[[page]]
index = 0
media_box = [10.0, 10.0, 310.0, 210.0]
rotate = 0

[expected]
geometry_source = "dual-parser-adjudicated"
tolerance_pt = 0.05
# Computer Modern Type1 下 mutool 的字形 quad 比 poppler 的词盒高出约 0.22pt；
# 这是字体度量的差，不是解析器分歧，因此与 tolerance_pt 分开声明。
ink_margin_pt = 0.3

[expected.structure]
pages = 1
blocks = 2
columns = 1

[[expected.block]]
key = "T1"
page = 0
column = "full"
draw_order = 1
reading_order = 1
text = "Rotation must not move the text in page space."

[[expected.block]]
key = "T2"
page = 0
column = "full"
draw_order = 2
reading_order = 2
text = "Second block, second font weight, well below the first."

[[expected.behaviour]]
id = "GEOM-05-origin"
assertion = "页面空间原点是 (10,10)：解析器报出的观看坐标须加上原点偏移才是页面坐标"
observable_via = "adjudicated.toml 中两块的盒子——它们比 rotate-0 那份整体偏移 (10, -10)"

[[expected.behaviour]]
id = "GEOM-05-no-cropbox"
assertion = "页面字典没有 CropBox，有效框即 MediaBox"
observable_via = "mutool pages 的输出中不出现 <CropBox>"

[oracle]
checks = ["determinism", "legality", "page-geometry", "structure", "reading-order", "dual-parser-geometry", "render"]
