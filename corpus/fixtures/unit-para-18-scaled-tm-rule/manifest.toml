[[expected.behaviour]]
id = "PARA-18-page-space-em"
assertion = "ParagraphFind uses the combined CTM/text-matrix vertical basis as the em, reconstructing four Word-export fragments as one two-line paragraph while preserving raw 1pt Tf for replay"
observable_via = "exact source bytes, recorded layout, and paragraph-find IL"

[[expected.behaviour]]
id = "TYPE-16-retained-rule-collision"
assertion = "A multiline translation may use blank rows below the source only until the next retained vector rule; output that would cross the rule remains one typed typeset_overflow paragraph"
observable_via = "walker-owned vector path, typeset_overflow_detail, degradation_summary, and final output ink"

[oracle]
checks = [
    "determinism",
    "legality",
    "page-geometry",
    "glyphs",
    "transformed-text-geometry",
    "pdf-bytes",
    "pdf-structure",
    "render",
]

[[adjudication]]
date = "2026-08-31"
issue = "Independent text parsers may aggregate the four text-show fragments by visual line even though the source contract is intentionally operand-granular."
resolution = "Keep four hand-derived exact text blocks; recorded layout and production ParagraphFind own the two-line paragraph reconstruction assertion."
