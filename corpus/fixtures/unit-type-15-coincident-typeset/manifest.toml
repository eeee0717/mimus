[[adjudication]]
date = "2026-08-30"
issue = "Word-derived translated output contains byte-identical same-origin shows that PDFium folds in its extraction view, while the content stream and ToUnicode mapping remain complete"
resolution = "Model extraction multiplicity explicitly and constrain equivalence to identical Unicode at the same baseline; do not weaken distinct-character or distinct-position validation"

[[adjudication]]
date = "2026-08-30"
issue = "The initial outline expectation used the single-show M bounds rather than the coincident-draw SVG bounds"
resolution = "Use the independently measured coincident-draw bounds shared with ALIGN-06; baseline and metric-box derivations remain unchanged"
