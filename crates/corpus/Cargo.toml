[package]
name = "corpus"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Corpus v1 生成合同的可执行门禁：工具链校验、确定性复现与 fixture 独立验收。"

# 硬约束（docs/03-corpus-requirements.md §2.5）：语料工具不得依赖 mimus 生产侧的
# lopdf 或 PDFium——用被测组件生成/裁定被测输入是循环论证。这里刻意不依赖
# `mimus-core`，并由 `tests/no_production_engines.rs` 在依赖闭包上自动守卫。

[[bin]]
name = "corpus"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { workspace = true }
flate2 = "1"
quick-xml = "0.41.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
svgtypes = "0.15"
toml = "0.9"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
